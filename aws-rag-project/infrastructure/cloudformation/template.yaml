AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Dengue Report RAG Assistant'

Resources:
  DengueS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: dengue-rag-assistant-bucket
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DengueAssistantLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DengueLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::dengue-rag-assistant-bucket/*'
              - Effect: Allow
                Action:
                  - textract:DetectDocumentText
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:RetrieveAndGenerate
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

Outputs:
  BucketName:
    Value: !Ref DengueS3Bucket
    Description: Name of the created S3 bucket
